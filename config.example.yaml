transport: stdio
log_level: INFO
# buckets_dir: /absolute/path/to/private-memory-data
merge_threshold: 75

dehydration:
  model: deepseek-chat
  base_url: https://api.deepseek.com/v1
  api_key: ""
  max_tokens: 1024
  temperature: 0.1

embedding:
  enabled: false
  model: text-embedding-3-small
  api_key: ""

matching:
  fuzzy_threshold: 50
  max_results: 5

scoring_weights:
  topic_relevance: 4.0
  emotion_resonance: 2.0
  time_proximity: 1.5
  importance: 1.0
  content_weight: 1.0

decay:
  lambda: 0.05
  threshold: 0.3
  check_interval_hours: 24
  emotion_weights:
    base: 1.0
    arousal_boost: 0.8

wikilink:
  enabled: true
  use_tags: false
  use_domain: true
  use_auto_keywords: true
  auto_top_k: 4
  min_keyword_len: 3
  exclude_keywords: []
