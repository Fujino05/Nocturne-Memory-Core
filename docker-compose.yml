services:
  nocturne-memory:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      OMBRE_TRANSPORT: streamable-http
      OMBRE_BUCKETS_DIR: /data
      OMBRE_API_KEY: ${OMBRE_API_KEY:-}
    volumes:
      - ${OMBRE_HOST_VAULT_DIR:-./buckets}:/data
